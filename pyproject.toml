[project]
name = "picture-loom"
version = "0.1.0"
description = "Convert images into circular weaving loom patterns"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow>=10.2.0"]

[project.scripts]
picture-loom = "picture_loom.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["types-pillow>=10.2.0.20240822"]
